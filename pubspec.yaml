name: kouvention
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  oktoast: ^3.4.0
  go_router: ^17.2.1
  shared_preferences: ^2.5.5
  build_runner: ^2.13.1
  envied: ^1.3.4
  firebase_auth: ^6.4.0
  video_player: ^2.11.1
  carousel_slider: ^5.1.2
  connectivity_plus: ^7.1.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.3.0
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  firebase_messaging: ^16.2.0
  googleapis_auth: ^2.3.0
  firebase_storage: ^13.3.0
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  intl: ^0.20.2
  swipe_to: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  envied_generator: ^1.3.4

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/videos/
    - service-account.json

  fonts:
    - family: Asap
      fonts:
        - asset: assets/fonts/Asap-Regular.ttf
        - asset: assets/fonts/Asap-Medium.ttf
          weight: 500
        - asset: assets/fonts/Asap-SemiBold.ttf
          weight: 600
