name: kouvention
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+1

environment:
  sdk: ^3.11.4

# ========================================
# Compile SQLite with encryption
# ========================================
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  oktoast: ^3.4.0
  go_router: ^17.2.1
  shared_preferences: ^2.5.5
  envied: ^1.3.4
  firebase_auth: ^6.4.0
  video_player: ^2.11.1
  carousel_slider: ^5.1.2
  connectivity_plus: ^7.1.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.3.0
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  firebase_messaging: ^16.2.0
  googleapis_auth: ^2.3.0
  firebase_storage: ^13.3.0
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  intl: ^0.20.2
  swipe_to: ^1.0.6
  scrollable_positioned_list: ^0.3.8
  drift: ^2.32.0
  # sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.3
  flutter_secure_storage: ^10.2.0
  freerasp: ^7.5.1
  cloudinary_url_gen: ^1.8.0
  dio: ^5.9.2

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.0
  flutter_test:
    sdk: flutter
  envied_generator: ^1.3.4
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Asap
      fonts:
        - asset: assets/fonts/Asap-Regular.ttf
        - asset: assets/fonts/Asap-Medium.ttf
          weight: 500
        - asset: assets/fonts/Asap-SemiBold.ttf
          weight: 600
