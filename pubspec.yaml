name: kouvention
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  oktoast: ^3.4.0
  go_router: ^17.2.1
  shared_preferences: ^2.5.5
  envied: ^1.3.4
  firebase_auth: ^6.4.0
  video_player: ^2.11.1
  flutter_native_video_trimmer: ^1.1.9
  carousel_slider: ^5.1.2
  connectivity_plus: ^7.1.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.3.0
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  firebase_messaging: ^16.2.0
  googleapis_auth: ^2.3.0
  firebase_storage: ^13.3.0
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  universal_file_viewer: ^0.1.4
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  fullscreen_image_viewer: ^1.2.0
  audioplayers: ^6.6.0
  video_thumbnail: ^0.5.6
  just_audio: ^0.9.46
  record: ^6.2.1
  permission_handler: ^12.0.1
  open_file: ^3.5.11
  intl: ^0.20.2
  swipe_to: ^1.0.6
  scrollable_positioned_list: ^0.3.8
  drift: ^2.32.0
  sqlite3: ^3.3.1
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.3
  flutter_secure_storage: ^10.2.0
  cloudinary_url_gen: ^1.8.0
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2
  flutter_story_presenter: ^1.0.7
  snackify: ^1.2.4

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  envied_generator: ^1.3.4
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0
  
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - service-account.json

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
